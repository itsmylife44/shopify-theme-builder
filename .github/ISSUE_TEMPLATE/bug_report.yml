name: Bug report
description: Something in the skill, the Studio or a catalog section doesn't work
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For a security problem, don't open an issue: follow [SECURITY.md](https://github.com/itsmylife44/shopify-theme-builder/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Paste error messages as text.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Ask the agent to …
        2. In the Studio, …
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Skill and Studio version
      description: "`metadata.version` in `skills/shopify-theme-builder/SKILL.md`"
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent
      description: The coding agent and its version
      placeholder: Claude Code 2.x, Codex, Cursor …
    validations:
      required: true
  - type: input
    id: shopify-cli
    attributes:
      label: Shopify CLI version
      description: "`shopify version`"
      placeholder: 4.8.0
  - type: input
    id: environment
    attributes:
      label: OS, Node.js and browser
      placeholder: macOS 15, Node.js 22.12, Chrome 140
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, the Theme Check output, the section involved …
